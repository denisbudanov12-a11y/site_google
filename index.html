    <script>
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var protoFetch = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return protoFetch;
              },
              set: function(val) {
                protoFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e2) {}
        }

        window.addEventListener('error', function(event) {
          if (
            event &&
            event.message &&
            event.message.indexOf('fetch') !== -1 &&
            (event.message.indexOf('getter') !== -1 || event.message.indexOf('Cannot set property') !== -1)
          ) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
